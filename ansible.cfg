[defaults]
inventory = inventory.yaml
roles_path = roles
remote_user = ansible
interpreter_python = auto_silent

# OpenSSH reads ~/.ssh/config automatically, so the `banas` Host block there
# (HostName + ProxyJump) is what makes remote runs work. That block only offers
# robert's key, so the ansible user's key has to be named here:
private_key_file = ~/.ssh/ansible_rsa

[privilege_escalation]
become = True
become_user = root

[ssh_connection]
pipelining = True
# Longer ControlPersist keeps a single multiplexed connection alive across the
# jump host, instead of re-dialing it for every task.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=10m
